name: One-off check (Spanish channel id)
on:
  push:
    branches: [claude/project-thread-lyq11t]
    paths: [.github/workflows/find-bot.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          ES: ${{ secrets.TELEGRAM_BOT_ES_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          j = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['ES']}/getUpdates", timeout=30))
          print("updates:", len(j.get("result", [])))
          seen = set()
          for u in j.get("result", []):
              for v in u.values():
                  c = isinstance(v, dict) and v.get("chat")
                  if c and c["id"] not in seen:
                      seen.add(c["id"])
                      t = (c.get("title") or "").lower()
                      print("chat", c["id"], c.get("type"), "GENIO" if "genio" in t else ("AFX" if "afx" in t else "other"))
          PY
