name: Find afxspainbot source (one-off check)
on:
  push:
    branches: [claude/project-thread-lyq11t]
    paths: [.github/workflows/find-bot.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: post-state-none
          restore-keys: post-state-
      - name: Read source info and check the Spanish bot there (prints no tokens)
        env:
          ES: ${{ secrets.TELEGRAM_BOT_ES_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          def tg(m, **q):
              try:
                  return json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['ES']}/{m}?" + urllib.parse.urlencode(q), timeout=20))
              except Exception as e:
                  return {"ok": False, "err": str(e)[:100]}
          st = json.load(open("state.json")) if os.path.exists("state.json") else {}
          print("top keys:", list(st)[:30])
          chans = st.get("channels", st)
          def walk(o, path=""):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k in ("source_seen",): print(path + k, v)
                      if k == "src": print(path + "src (last 5):", json.dumps(v[-5:], ensure_ascii=False))
                      if k == "src_raw": print(path + "src_raw (last 3):", json.dumps(v[-3:], ensure_ascii=False)[:1500])
                      walk(v, path + k + ".")
          walk(st)
          me = tg("getMe")["result"]
          ids = set()
          def collect(o):
              if isinstance(o, dict):
                  if "source_seen" in o and isinstance(o["source_seen"], dict): ids.add(o["source_seen"].get("id"))
                  for v in o.values(): collect(v)
          collect(st)
          for cid in ids:
              c = tg("getChat", chat_id=cid)
              print("source", cid, "getChat ok:", c.get("ok"), c.get("result", {}).get("title"), c.get("description"))
              m = tg("getChatMember", chat_id=cid, user_id=me["id"])
              print("  spanish bot status there:", m.get("result", {}).get("status"), m.get("description"))
          up = tg("getUpdates", allowed_updates=json.dumps(["message","channel_post","my_chat_member","chat_member"]))
          print("updates:", len(up.get("result", [])))
          for u in up.get("result", []):
              for k, v in u.items():
                  if isinstance(v, dict) and "chat" in v:
                      print(" ", k, v["chat"].get("id"), v["chat"].get("type"), v["chat"].get("title"))
          PY
