name: Post charts to Telegram

on:
  schedule:
    # GitHub cron is UTC. Brazil (BRT) = UTC-3. Mon–Fri. 17:00 BRT is posted by hand.
    - cron: "0 12 * * 1-5"   # 09:00 BRT  good morning + market prices
    - cron: "0 14 * * 1-5"   # 11:00 BRT  asset overview (poll winner)
    - cron: "0 16 * * 1-5"   # 13:00 BRT  signal / signal result
    - cron: "0 18 * * 1-5"   # 15:00 BRT  poll
    - cron: "0 22 * * 1-5"   # 19:00 BRT  signal / signal result
    - cron: "0 0 * * 2-6"    # 21:00 BRT  news roundup (00:00 UTC next day)
  workflow_dispatch:
    inputs:
      mode:
        description: "slot = run one slot now · test = post one entry chart · report = poll history"
        default: "slot"
        type: choice
        options: [slot, test, report]
      hour:
        description: "BRT slot for slot mode"
        default: "9"
        type: choice
        options: ["9", "11", "13", "15", "19", "21"]
      dry_run:
        description: "Build the posts without sending them"
        default: false
        type: boolean

concurrency: telegram-poster          # one run at a time: they share the saved state

permissions:
  contents: read
  actions: write                      # keep-alive: stops GitHub pausing the schedule after 60 quiet days
  issues: write                       # failure alerts arrive as a GitHub issue (GitHub emails it to you)

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore memory (posted signals, polls, source channel position)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: post-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: post-state-
      - name: Pick slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * 1-5") echo "hour=9"  >> "$GITHUB_OUTPUT" ;;
            "0 14 * * 1-5") echo "hour=11" >> "$GITHUB_OUTPUT" ;;
            "0 16 * * 1-5") echo "hour=13" >> "$GITHUB_OUTPUT" ;;
            "0 18 * * 1-5") echo "hour=15" >> "$GITHUB_OUTPUT" ;;
            "0 22 * * 1-5") echo "hour=19" >> "$GITHUB_OUTPUT" ;;
            "0 0 * * 2-6")  echo "hour=21" >> "$GITHUB_OUTPUT" ;;
            *)              echo "hour=${{ inputs.hour }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check bot access
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python scrape.py channels
      - name: Post
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MPLBACKEND: Agg
        run: |
          touch state.json; [ -s state.json ] || echo "{}" > state.json
          LIVE="--live"; [ "${{ inputs.dry_run }}" = "true" ] && LIVE=""
          case "${{ github.event_name }}/${{ inputs.mode }}" in
            workflow_dispatch/test)   python scrape.py test $LIVE ;;
            workflow_dispatch/report) python daily.py report ;;
            *)                        python daily.py run ${{ steps.slot.outputs.hour }} $LIVE ;;
          esac
      - name: Send poll report to the "Poll reports" issue
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          NUM=$(gh issue list -R "$R" --state open --label poll-report --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            gh label create poll-report -R "$R" --color 1D76DB 2>/dev/null || true
            NUM=$(gh issue create -R "$R" --title "📊 Relatório de enquetes" --label poll-report \
              --body "Cada enquete encerrada aparece aqui como comentário (GitHub envia por e-mail)." | grep -o '[0-9]*$')
          fi
          gh issue comment "$NUM" -R "$R" --body-file report.md
      - name: Save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: post-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep images as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: charts/*.png
          retention-days: 7
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/post.yml/enable" || true
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="⚠️ Autoposter: o post das ${{ steps.slot.outputs.hour }}h falhou. Detalhes: $URL"
          NUM=$(gh issue list -R "${{ github.repository }}" --state open --label autoposter-alert --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "${{ github.repository }}" --body "$MSG"
          else
            gh label create autoposter-alert -R "${{ github.repository }}" --color D93F0B 2>/dev/null || true
            gh issue create -R "${{ github.repository }}" --title "Autoposter: a scheduled post failed" --label autoposter-alert \
              --body "$MSG"$'\n\n'"Close this issue once it is fixed; the next failure opens a new one."
          fi
          OWNER=$(python3 -c "import json,os,sys; e=os.getenv('OWNER_CHAT_ID','').strip(); d=json.load(open('state.json')).get('_daily',{}) if os.path.exists('state.json') else {}; ids=[v.get('owner_id') or v.get('creator_id') for v in d.values() if isinstance(v,dict)]; print(e if e.lstrip('-').isdigit() else next((i for i in ids if i),''))" 2>/dev/null || true)
          if [ -n "$OWNER" ]; then
            curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$OWNER" --data-urlencode text="$MSG" >/dev/null
          fi
