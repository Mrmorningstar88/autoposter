name: Post charts to Telegram

on:
  schedule:
    # GitHub cron is UTC; Brazil (BRT) = UTC-3. Slots 09/11/13/15/19 BRT Mon–Fri, 21 BRT (00 UTC Tue–Sat), 11 BRT Sat–Sun.
    # GitHub drops and delays scheduled runs (worst at :00, its busiest minute), so each slot gets three attempts off the hour; the first one that runs posts it
    # and the others skip (slots.py). 17:00 BRT is posted by hand.
    # The same attempts every hour while forex trades (Sun 21 UTC – Sat 00 UTC) also relay new source signals to the
    # relay channels (channels.json "mode": "relay"); a run with no slot due and nothing to relay stops after a 5-second check.
    - cron: "7,27,47 * * * 1-5"
    - cron: "7,27,47 0 * * 6"
    - cron: "7,27,47 21-23 * * 0"
    - cron: "7,27,47 14 * * 0,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = post whatever slot is due now, once (used by backup timers) · relay = relay new source signals to the relay channels now · slot = run the chosen slot now · test = post one entry chart · report = poll history · emoji = list animated emoji packs (artifact)"
        default: "slot"
        type: choice
        options: [slot, auto, relay, test, report, scrub, emoji]
      hour:
        description: "BRT slot for slot mode"
        default: "9"
        type: choice
        options: ["9", "11", "13", "15", "19", "21"]
      message_ids:
        description: "scrub mode: channel message numbers to remove the DM line from, e.g. 19 20 · emoji mode: extra pack names"
        default: ""
      dry_run:
        description: "Build the posts without sending them"
        default: false
        type: boolean

concurrency: telegram-poster          # one run at a time: they share the saved state

permissions:
  contents: read
  actions: write                      # keep-alive: stops GitHub pausing the schedule after 60 quiet days
  issues: write                       # failure alerts arrive as a GitHub issue (GitHub emails it to you)

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore memory (posted signals, polls, source channel position)
        id: mem
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: post-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: post-state-
      - name: Retry restoring memory once
        id: mem2
        if: steps.mem.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: post-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: post-state-
      - name: Check memory (keep posting even if it could not be loaded)
        id: guard
        if: steps.mem.outputs.cache-matched-key == '' && steps.mem2.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh cache list -R "${{ github.repository }}" --key post-state- --json key -q 'length' 2>/dev/null || echo err)
          if [ "$N" != "0" ]; then
            echo "degraded=1" >> "$GITHUB_OUTPUT"
            echo "::warning::saved memory exists but could not be loaded ($N); posting anyway, the channel check prevents repeats, memory is not overwritten"
          fi
      - name: Pick slot (skip if this slot was already posted) and check the relay channels
        id: slot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: |
          H=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            H="${{ inputs.hour }}"
            echo "hour=$H" >> "$GITHUB_OUTPUT"
          else
            H=$(python3 slots.py due state.json)
            echo "hour=$H" >> "$GITHUB_OUTPUT"
            [ -n "$H" ] && echo "posting the ${H}h slot" || echo "nothing due (already posted or outside a slot window)"
          fi
          R=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "auto" ] || [ "${{ inputs.mode }}" = "relay" ]; then
            R=$(python3 slots.py relay state.json || true)
            [ "${{ inputs.mode }}" = "relay" ] && R=1
          fi
          echo "relay=$R" >> "$GITHUB_OUTPUT"
          [ -n "$R" ] && echo "relay channels: new source posts to relay"
          [ -n "$H$R" ] && echo "run=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run != ''
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.slot.outputs.run != ''
      - name: Check bot access
        if: steps.slot.outputs.hour != ''
        continue-on-error: true            # diagnostic only: a hiccup here must never stop the post
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: python scrape.py channels
      - name: Post
        if: steps.slot.outputs.run != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MPLBACKEND: Agg
        run: |
          touch state.json; [ -s state.json ] || echo "{}" > state.json
          LIVE="--live"; [ "${{ inputs.dry_run }}" = "true" ] && LIVE=""
          case "${{ github.event_name }}/${{ inputs.mode }}" in
            workflow_dispatch/test)   python scrape.py test $LIVE ;;
            workflow_dispatch/report) python daily.py report ;;
            workflow_dispatch/scrub)  python daily.py scrub ${{ inputs.message_ids }} $LIVE ;;
            workflow_dispatch/emoji)  python emoji_catalog.py ${{ inputs.message_ids }} ;;
            workflow_dispatch/relay)  python daily.py relay $LIVE ;;
            *)  RC=0
                [ -n "${{ steps.slot.outputs.hour }}" ] && { python daily.py run ${{ steps.slot.outputs.hour }} $LIVE || RC=1; }
                if [ -n "${{ steps.slot.outputs.relay }}" ] || [ "${{ github.event_name }}" = "schedule" ]; then
                  python daily.py relay $LIVE || RC=1          # after a slot too: its update read may have brought a signal
                fi
                exit $RC ;;
          esac
      - name: Send poll report to the "Poll reports" issue
        if: always() && hashFiles('report.md') != ''
        continue-on-error: true            # the report is also in the run summary and the owner DM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          NUM=$(gh issue list -R "$R" --state open --label poll-report --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            gh label create poll-report -R "$R" --color 1D76DB 2>/dev/null || true
            NUM=$(gh issue create -R "$R" --title "📊 Relatório de enquetes" --label poll-report \
              --body "Cada enquete encerrada aparece aqui como comentário (GitHub envia por e-mail)." | grep -o '[0-9]*$')
          fi
          [ -n "$NUM" ] && gh issue comment "$NUM" -R "$R" --body-file report.md
      - name: Save memory
        if: always() && steps.slot.outputs.run != '' && steps.guard.outputs.degraded != '1' && inputs.mode != 'emoji'   # skipped or degraded runs never overwrite it
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: post-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep images as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: |
            charts/*.png
            charts/*.json
          retention-days: 7
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/post.yml/enable" || true
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="⚠️ Autoposter: o post das ${{ steps.slot.outputs.hour }}h falhou. Detalhes: $URL"
          OWNER=$(python3 -c "import json,os,sys; e=os.getenv('OWNER_CHAT_ID','').strip(); d=json.load(open('state.json')).get('_daily',{}) if os.path.exists('state.json') else {}; ids=[v.get('owner_id') or v.get('creator_id') for v in d.values() if isinstance(v,dict)]; print(e if e.lstrip('-').isdigit() else next((i for i in ids if i),''))" 2>/dev/null || true)
          if [ -n "$OWNER" ]; then
            curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$OWNER" --data-urlencode text="$MSG" >/dev/null || true
          fi
          NUM=$(gh issue list -R "${{ github.repository }}" --state open --label autoposter-alert --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "${{ github.repository }}" --body "$MSG" || true
          else
            gh label create autoposter-alert -R "${{ github.repository }}" --color D93F0B 2>/dev/null || true
            gh issue create -R "${{ github.repository }}" --title "Autoposter: a scheduled post failed" --label autoposter-alert \
              --body "$MSG"$'\n\n'"Close this issue once it is fixed; the next failure opens a new one." || true
          fi
