name: announce
# One post (optionally pinned) in a channel by the Portuguese bot @gabifxport_bot, run by hand or by Claude after the
# owner's «да» on the exact text (Arut 2026-11-24: the VIP entry post in @sanstostrades).
on:
  workflow_dispatch:
    inputs:
      chat:
        description: "Channel (@name or -100… id) where the bot is an admin"
        required: true
        default: "@sanstostrades"
      text:
        description: "The post's text, exactly as approved"
        required: true
      pin:
        description: "Pin the post"
        type: boolean
        default: true
permissions:
  contents: none
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send and pin
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ inputs.chat }}
          TEXT: ${{ inputs.text }}
          PIN: ${{ inputs.pin }}
        run: |
          R=$(curl -sS --max-time 20 "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$TEXT" --data-urlencode "disable_web_page_preview=true")
          echo "$R" | jq -c '{ok, id: .result.message_id, error: .description}'
          ID=$(echo "$R" | jq -r '.result.message_id // empty'); [ -n "$ID" ] || exit 1
          if [ "$PIN" = "true" ]; then
            curl -sS --max-time 20 "https://api.telegram.org/bot$TG_BOT_TOKEN/pinChatMessage" \
              --data-urlencode "chat_id=$CHAT" --data-urlencode "message_id=$ID" --data-urlencode "disable_notification=true" | jq -c '{ok, error: .description}'
          fi
